[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nourish-nest"
version = "0.1.0"
description = "Production-oriented AI household manager for nutrition, groceries, inventory, and chores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2,<3",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
agents = [
  "langchain>=0.3,<1",
  "langgraph>=0.2,<1",
]
rag = [
  "chromadb>=0.5,<2",
  "rank-bm25>=0.2,<1",
  "sentence-transformers>=3,<6",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nourish_nest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

